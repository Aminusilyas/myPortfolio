<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Aminu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Aminu</a>
        <nav class="nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container section">
      <h1>Contact</h1>
      <p class="muted">Send a message — I'll reply as soon as I can.</p>

      <form id="contactForm" class="contact-form">
        <label>
          Name
          <input type="text" name="name" required />
        </label>

        <label>
          Email
          <input type="email" name="email" required />
        </label>

        <label>
          Message
          <textarea name="message" rows="6" required></textarea>
        </label>

        <div>
          <button class="btn" type="submit">Send message</button>
        </div>
      </form>

      <p class="muted">Or email me at <a href="mailto:aminushehuilyasu@gmail.com">aminushehuilyasu@gmail.com</a></p>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year-contact"></span> Aminu</p>
      </div>
    </footer>

    <script src="main.js" defer></script>
  </body>
</html>
